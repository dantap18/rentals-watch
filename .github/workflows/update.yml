name: Update listings

on:
  schedule:
    - cron: "*/30 * * * *"   # every ~30 min (GitHub may delay scheduled runs a bit)
  workflow_dispatch:          # "Run workflow" button = check Yad2 now
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Load previous snapshot (cache, else live site)
        run: |
          if [ -s state/listings.json ]; then cp state/listings.json prev.json
          else curl -fsSL "${{ steps.pages.outputs.base_url }}/data/listings.json?t=$(date +%s)" -o prev.json || echo '{}' > prev.json
          fi

      - name: Fetch Yad2
        run: node scripts/fetch.mjs prev.json site/data/listings.json

      - name: Save state
        run: mkdir -p state && cp site/data/listings.json state/listings.json

      - uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assemble site
        run: cp index.html site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
